    <title>Milestone AI — Adaptive Learning Blueprints</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('milestone_theme');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') || 'dark';
          var isLight = theme === 'light';
          document.documentElement.classList.toggle('light', isLight);
          document.documentElement.classList.toggle('dark', !isLight);
          document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isLight ? '#f5f7fa' : '#0b0d14');
        } catch (e) {}
      })();
    </script>
